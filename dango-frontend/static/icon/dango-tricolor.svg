<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFBF5"/>
      <stop offset="0.55" stop-color="#FFF0DF"/>
      <stop offset="1" stop-color="#FFD9BE"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C08848"/>
      <stop offset="0.42" stop-color="#E9BC80"/>
      <stop offset="0.62" stop-color="#F4D3A3"/>
      <stop offset="1" stop-color="#BE8444"/>
    </linearGradient>

    <radialGradient id="pink" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#FFE8EE"/>
      <stop offset="0.38" stop-color="#FAB6C5"/>
      <stop offset="0.78" stop-color="#F49CB0"/>
      <stop offset="1" stop-color="#DE7B93"/>
    </radialGradient>
    <radialGradient id="shadePink" cx="0.52" cy="0.46" r="0.62">
      <stop offset="0.52" stop-color="#A94F68" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#A94F68" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#A94F68" stop-opacity="0.26"/>
    </radialGradient>

    <radialGradient id="cream" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#FFF9EC"/>
      <stop offset="0.8" stop-color="#F7E7CC"/>
      <stop offset="1" stop-color="#E3C9A5"/>
    </radialGradient>
    <radialGradient id="shadeCream" cx="0.52" cy="0.46" r="0.62">
      <stop offset="0.52" stop-color="#9A7447" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#9A7447" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9A7447" stop-opacity="0.24"/>
    </radialGradient>

    <radialGradient id="matcha" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#E8F7E1"/>
      <stop offset="0.4" stop-color="#BCE0B2"/>
      <stop offset="0.78" stop-color="#A3D097"/>
      <stop offset="1" stop-color="#7DB473"/>
    </radialGradient>
    <radialGradient id="shadeMatcha" cx="0.52" cy="0.46" r="0.62">
      <stop offset="0.52" stop-color="#3F6B3B" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#3F6B3B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3F6B3B" stop-opacity="0.24"/>
    </radialGradient>

    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6B4632" stop-opacity="0.30"/>
      <stop offset="0.65" stop-color="#6B4632" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6B4632" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="430" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="392" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="6"/>

  <!-- 樱花点缀 -->
  <g transform="translate(206 248) rotate(-12)" fill="#F3A9BA" opacity="0.55">
    <ellipse cx="0" cy="-24" rx="14" ry="22"/>
    <ellipse cx="0" cy="-24" rx="14" ry="22" transform="rotate(72)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="22" transform="rotate(144)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="22" transform="rotate(216)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="22" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="5" fill="#FFF6E8"/>
  </g>
  <g transform="translate(814 824) rotate(18) scale(0.78)" fill="#F3A9BA" opacity="0.5">
    <ellipse cx="0" cy="-24" rx="14" ry="22"/>
    <ellipse cx="0" cy="-24" rx="14" ry="22" transform="rotate(72)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="22" transform="rotate(144)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="22" transform="rotate(216)"/>
    <ellipse cx="0" cy="-24" rx="14" ry="22" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="5" fill="#FFF6E8"/>
  </g>

  <!-- 整体投影 -->
  <ellipse cx="512" cy="958" rx="210" ry="34" fill="url(#contact)"/>

  <g transform="rotate(-7 512 560)">
    <!-- 竹签 -->
    <rect x="492" y="80" width="40" height="932" rx="20" fill="url(#stick)"/>
    <rect x="500" y="88" width="10" height="916" rx="5" fill="#FFE3B5" opacity="0.55"/>

    <!-- 绿色团子（最下） -->
    <circle cx="512" cy="800" r="150" fill="url(#matcha)"/>
    <circle cx="512" cy="800" r="150" fill="url(#shadeMatcha)"/>
    <ellipse cx="452" cy="742" rx="64" ry="36" fill="#FFFFFF" opacity="0.55" transform="rotate(-24 452 742)"/>
    <circle cx="424" cy="716" r="12" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="512" cy="800" r="150" fill="none" stroke="#4E6B45" stroke-opacity="0.12" stroke-width="4"/>

    <!-- 接触阴影：绿→白 -->
    <ellipse cx="512" cy="674" rx="126" ry="28" fill="url(#contact)"/>

    <!-- 白色团子（中间） -->
    <circle cx="512" cy="546" r="150" fill="url(#cream)"/>
    <circle cx="512" cy="546" r="150" fill="url(#shadeCream)"/>
    <ellipse cx="452" cy="488" rx="64" ry="36" fill="#FFFFFF" opacity="0.85" transform="rotate(-24 452 488)"/>
    <circle cx="424" cy="462" r="12" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="512" cy="546" r="150" fill="none" stroke="#8F7047" stroke-opacity="0.10" stroke-width="4"/>

    <!-- 接触阴影：白→粉 -->
    <ellipse cx="512" cy="420" rx="126" ry="28" fill="url(#contact)"/>

    <!-- 粉色团子（最上） -->
    <circle cx="512" cy="292" r="150" fill="url(#pink)"/>
    <circle cx="512" cy="292" r="150" fill="url(#shadePink)"/>
    <ellipse cx="452" cy="234" rx="64" ry="36" fill="#FFFFFF" opacity="0.62" transform="rotate(-24 452 234)"/>
    <circle cx="424" cy="208" r="12" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="512" cy="292" r="150" fill="none" stroke="#93485E" stroke-opacity="0.12" stroke-width="4"/>
  </g>
</svg>
