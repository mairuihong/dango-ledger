<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 纯色上下渐变背景（接近 iconfont 的干净白底） -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0E4"/>
    </linearGradient>

    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B4226"/>
      <stop offset="0.45" stop-color="#4A2A18"/>
      <stop offset="1" stop-color="#2F190D"/>
    </linearGradient>
  </defs>

  <!-- 背景：纯色上下渐变 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 参考 iconfont 三色团子：黄 / 粉 / 绿，45° 斜串，签只从右下方露出 -->
  <g transform="rotate(-45 512 560)">
    <!-- 竹签（只在最下方团子之后露出） -->
    <rect x="499" y="790" width="26" height="290" rx="13" fill="url(#stick)"/>
    <rect x="505" y="798" width="6" height="274" rx="3" fill="#8A5A38" opacity="0.55"/>

    <!-- 粉色团子（夹在中间，先画，被黄/绿压住） -->
    <circle cx="512" cy="548" r="140" fill="#D086AB"/>
    <ellipse cx="470" cy="500" rx="26" ry="38" fill="#FFF4F8" opacity="0.78" transform="rotate(-20 470 500)"/>
    <circle cx="444" cy="474" r="9" fill="#FFF4F8" opacity="0.85"/>

    <!-- 绿色团子（右下，压住粉色） -->
    <circle cx="512" cy="766" r="140" fill="#C1D28D"/>
    <ellipse cx="470" cy="718" rx="24" ry="34" fill="#FDFFF2" opacity="0.72" transform="rotate(-20 470 718)"/>
    <circle cx="446" cy="694" r="8" fill="#FDFFF2" opacity="0.8"/>

    <!-- 黄色团子（左上，最前） -->
    <circle cx="512" cy="330" r="140" fill="#E3CB50"/>
    <circle cx="470" cy="286" r="34" fill="#FFFDF0" opacity="0.88"/>
    <circle cx="444" cy="260" r="10" fill="#FFFDF0" opacity="0.9"/>
  </g>

  <!-- iconfont 同款小装饰 -->
  <circle cx="760" cy="248" r="24" fill="none" stroke="#7AAEE3" stroke-width="9"/>
  <circle cx="806" cy="430" r="10" fill="#8FBF6A"/>
  <circle cx="250" cy="730" r="22" fill="none" stroke="#E7A8C4" stroke-width="9"/>
</svg>
