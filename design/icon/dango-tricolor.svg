<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 纯色上下渐变背景 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9F1"/>
      <stop offset="1" stop-color="#FFD6B8"/>
    </linearGradient>

    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C08848"/>
      <stop offset="0.42" stop-color="#E9BC80"/>
      <stop offset="0.62" stop-color="#F4D3A3"/>
      <stop offset="1" stop-color="#BE8444"/>
    </linearGradient>

    <radialGradient id="pink" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#FFE8EE"/>
      <stop offset="0.38" stop-color="#FAB6C5"/>
      <stop offset="0.78" stop-color="#F49CB0"/>
      <stop offset="1" stop-color="#DE7B93"/>
    </radialGradient>
    <radialGradient id="shadePink" cx="0.52" cy="0.46" r="0.62">
      <stop offset="0.52" stop-color="#A94F68" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#A94F68" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#A94F68" stop-opacity="0.26"/>
    </radialGradient>

    <radialGradient id="cream" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#FFF9EC"/>
      <stop offset="0.8" stop-color="#F7E7CC"/>
      <stop offset="1" stop-color="#E3C9A5"/>
    </radialGradient>
    <radialGradient id="shadeCream" cx="0.52" cy="0.46" r="0.62">
      <stop offset="0.52" stop-color="#9A7447" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#9A7447" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9A7447" stop-opacity="0.24"/>
    </radialGradient>

    <radialGradient id="matcha" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#E8F7E1"/>
      <stop offset="0.4" stop-color="#BCE0B2"/>
      <stop offset="0.78" stop-color="#A3D097"/>
      <stop offset="1" stop-color="#7DB473"/>
    </radialGradient>
    <radialGradient id="shadeMatcha" cx="0.52" cy="0.46" r="0.62">
      <stop offset="0.52" stop-color="#3F6B3B" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#3F6B3B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3F6B3B" stop-opacity="0.24"/>
    </radialGradient>

    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6B4632" stop-opacity="0.30"/>
      <stop offset="0.65" stop-color="#6B4632" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6B4632" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景：纯色上下渐变，无装饰 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 与 🍡 一致：竹签从左上到右下约 45°，签尖/签尾露出较长 -->
  <g transform="rotate(-45 512 560)">
    <!-- 竹签 -->
    <rect x="489" y="30" width="46" height="1000" rx="23" fill="url(#stick)"/>
    <rect x="500" y="38" width="10" height="984" rx="5" fill="#FFE3B5" opacity="0.55"/>

    <!-- 绿色团子（右下） -->
    <circle cx="512" cy="766" r="130" fill="url(#matcha)"/>
    <circle cx="512" cy="766" r="130" fill="url(#shadeMatcha)"/>
    <ellipse cx="452" cy="708" rx="56" ry="31" fill="#FFFFFF" opacity="0.55" transform="rotate(-24 452 708)"/>
    <circle cx="424" cy="682" r="10" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="512" cy="766" r="130" fill="none" stroke="#4E6B45" stroke-opacity="0.12" stroke-width="4"/>

    <!-- 接触阴影：绿→白 -->
    <ellipse cx="512" cy="656" rx="110" ry="24" fill="url(#contact)"/>

    <!-- 白色团子（中间） -->
    <circle cx="512" cy="548" r="130" fill="url(#cream)"/>
    <circle cx="512" cy="548" r="130" fill="url(#shadeCream)"/>
    <ellipse cx="452" cy="490" rx="56" ry="31" fill="#FFFFFF" opacity="0.85" transform="rotate(-24 452 490)"/>
    <circle cx="424" cy="464" r="10" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="512" cy="548" r="130" fill="none" stroke="#8F7047" stroke-opacity="0.10" stroke-width="4"/>

    <!-- 接触阴影：白→粉 -->
    <ellipse cx="512" cy="438" rx="110" ry="24" fill="url(#contact)"/>

    <!-- 粉色团子（左上） -->
    <circle cx="512" cy="330" r="130" fill="url(#pink)"/>
    <circle cx="512" cy="330" r="130" fill="url(#shadePink)"/>
    <ellipse cx="452" cy="272" rx="56" ry="31" fill="#FFFFFF" opacity="0.62" transform="rotate(-24 452 272)"/>
    <circle cx="424" cy="246" r="10" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="512" cy="330" r="130" fill="none" stroke="#93485E" stroke-opacity="0.12" stroke-width="4"/>
  </g>
</svg>
